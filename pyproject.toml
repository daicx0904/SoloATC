[project]
name = "soloatc"
version = "0.1.0"
description = "Single-player AI ATC system for X-Plane 12"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SoloATC contributors" }]
dependencies = [
    "pydantic>=2.5",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "services", "clients", "shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
